    <style>
        * {

            box-sizing: border-box;
        }

        html, body {
            height: 100%;

        }

        .wrapper {
            height: 100vh;
            overflow-y: scroll;
            scroll-behavior: smooth;
            background-image: url('https://picsum.photos/id/1015/1920/1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .page {

            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 60px;
        }

        .page-content {
            max-width: 90%;
            width: 100%;
            text-align: center;
            color: #1a1a1a;
        }

        .page-content h2 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 16px;
            color: #1a1a1a;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.25);
        }

        .page-content p {
            font-size: 18px;
            line-height: 2;
            opacity: 0.75;
            color: #1a1a1a;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.15);
            max-width: 700px;
            margin: 0 auto;
        }

        /* 第一页极简 */
        .page-1 .page-content h2 {
            font-size: 52px;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 12px;
        }

        .page-1 .page-content .sub {
            font-size: 16px;
            font-weight: 400;
            color: #999;
            letter-spacing: 5px;
            margin-bottom: 32px;
        }

        .page-1 .page-content .divider {
            width: 32px;
            height: 1px;
            background: #ccc;
            margin: 0 auto 32px;
        }

        .page-1 .page-content .bio {
            font-size: 17px;
            line-height: 2;
            color: #555;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .page-1 .page-content .links {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .page-1 .page-content .links a {
            font-size: 14px;
            color: #777;
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: color 0.2s ease;
            font-weight: 400;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }

        .page-1 .page-content .links a:hover {
            color: #000;
            border-bottom-color: #000;
        }

        .page-1 .page-content .footer {
            font-size: 12px;
            color: #ccc;
            letter-spacing: 1.5px;
        }

        .page-1 .page-content .footer a {
            color: #ccc;
            text-decoration: none;
        }

        .page-1 .page-content .footer a:hover {
            color: #999;
        }

        .hint {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.2);
            font-size: 13px;
            letter-spacing: 3px;
            animation: bounce 2.5s infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        @media (max-width: 768px) {
            .page {
                padding: 30px 30px;
            }
            .page-content h2 {
                font-size: 36px;
            }
            .page-1 .page-content h2 {
                font-size: 40px;
            }
            .page-1 .page-content .bio {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .page {
                padding: 20px 20px;
            }
            .page-content h2 {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .page-content p {
                font-size: 16px;
            }
            .page-1 .page-content h2 {
                font-size: 32px;
                letter-spacing: 3px;
            }
            .page-1 .page-content .sub {
                font-size: 14px;
                letter-spacing: 3px;
            }
            .page-1 .page-content .bio {
                font-size: 15px;
            }
            .page-1 .page-content .links {
                gap: 16px;
            }
            .page-1 .page-content .links a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="hint">↓ 滚动翻页 ↓</div>

    <script>
        const wrapper = document.getElementById('wrapper');
        let timer = null;
        let isScrolling = false;

        wrapper.addEventListener('scroll', function() {
            isScrolling = true;
            clearTimeout(timer);
            timer = setTimeout(function() {
                isScrolling = false;
                snapToNearest();
            }, 150);
        });

        function snapToNearest() {
            const pages = document.querySelectorAll('.page');
            const scrollTop = wrapper.scrollTop;
            let closestPage = 0;
            let closestDist = Infinity;

            pages.forEach((page, index) => {
                const offsetTop = page.offsetTop;
                const dist = Math.abs(scrollTop - offsetTop);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestPage = index;
                }
            });

            const threshold = window.innerHeight * 0.4;
            if (closestDist < threshold) {
                wrapper.scrollTo({
                    top: pages[closestPage].offsetTop,
                    behavior: 'smooth'
                });
            }
        }

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (!isScrolling) {
                    snapToNearest();
                }
            }, 300);
        });
    </script>
