<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccwOtter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
        }

        .wrapper {
            height: 100vh;
            overflow-y: scroll;
            scroll-behavior: smooth;
            background-image: url('https://picsum.photos/1920/1080?random=1');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .page {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            color: #fff;
        }

        /* 文字直接显示，不要框 */
        .page-content {
            max-width: 90%;
            width: 100%;
            text-align: center;
            color: #fff;
        }

        .page-content h2 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .page-content p {
            font-size: 18px;
            line-height: 1.8;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* 第一页保留卡片样式（白底+框） */
        .page-1 .page-content {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: none;
            color: #1a1a1a;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            max-width: 520px;
            padding: 40px 24px;
            border-radius: 16px;
        }

        .page-1 .page-content h2 {
            text-shadow: none;
        }
        .page-1 .page-content p {
            text-shadow: none;
        }

        .page-1 .page-content .sub {
            font-size: 15px;
            font-weight: 400;
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .page-1 .page-content .divider {
            width: 32px;
            height: 1px;
            background: #ccc;
            margin: 0 auto 20px;
        }

        .page-1 .page-content .bio {
            font-size: 15px;
            line-height: 1.9;
            color: #444;
            margin-bottom: 24px;
            font-weight: 300;
        }

        .page-1 .page-content .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .page-1 .page-content .links a {
            font-size: 14px;
            color: #555;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s ease;
            font-weight: 400;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }

        .page-1 .page-content .links a:hover {
            color: #000;
            border-bottom-color: #000;
        }

        .page-1 .page-content .footer {
            font-size: 12px;
            color: #bbb;
            letter-spacing: 1px;
        }

        .page-1 .page-content .footer a {
            color: #bbb;
            text-decoration: none;
        }

        .page-1 .page-content .footer a:hover {
            color: #888;
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        @media (max-width: 480px) {
            .page-content h2 { font-size: 28px; }
            .page-1 .page-content { max-width: 100%; margin: 0 16px; padding: 30px 16px; }
            .page-1 .page-content .links { gap: 14px; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="wrapper">

        <section class="page page-1">
            <div class="page-content">
                <h2>ccw Otter</h2>
                <p class="sub">Student · Developer</p>
                <div class="divider"></div>
                <p class="bio">
                    你好，我是 ccwOtter。<br />
                    活跃于网上的player。
                </p>
                <div class="links">
                    <a href="https://github.com/ccwOtter" target="_blank">GitHub</a>
                    <a href="https://space.bilibili.com/1024418680" target="_blank">bilibili</a>
                    <a href="https://www.ccw.site/student/62bfbc958cf2185c64235322" target="_blank">共创世界</a>
                    <a href="https://x.com/ccwOtter" target="_blank">X</a>
                    <a href="https://www.pixiv.net/users/117660102" target="_blank">pixiv</a>
                    <a href="https://discord.com/users/1139064743097806930" target="_blank">discord</a>
                    <a href="mailto:otter_yyds@163.com">邮箱</a>
                </div>
                <div class="footer">
                    © 2026 · <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
                </div>
            </div>
        </section>

        <section class="page page-2">
            <div class="page-content">
                <h2>🌄 第二页</h2>
                <p>文字直接显示在背景上，没有框。</p>
            </div>
        </section>

        <section class="page page-3">
            <div class="page-content">
                <h2>🌿 第三页</h2>
                <p>宽度占屏幕的 90%，看起来更大气。</p>
            </div>
        </section>

        <section class="page page-4">
            <div class="page-content">
                <h2>🏔️ 第四页</h2>
                <p>背景图固定，只有文字在翻页。</p>
            </div>
        </section>

    </div>

    <div class="hint">↓ 滚动翻页 ↓</div>

    <script>
        const wrapper = document.getElementById('wrapper');
        let timer = null;
        let isScrolling = false;

        wrapper.addEventListener('scroll', function() {
            isScrolling = true;
            clearTimeout(timer);
            timer = setTimeout(function() {
                isScrolling = false;
                snapToNearest();
            }, 150);
        });

        function snapToNearest() {
            const pages = document.querySelectorAll('.page');
            const scrollTop = wrapper.scrollTop;
            let closestPage = 0;
            let closestDist = Infinity;

            pages.forEach((page, index) => {
                const offsetTop = page.offsetTop;
                const dist = Math.abs(scrollTop - offsetTop);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestPage = index;
                }
            });

            const threshold = window.innerHeight * 0.4;
            if (closestDist < threshold) {
                wrapper.scrollTo({
                    top: pages[closestPage].offsetTop,
                    behavior: 'smooth'
                });
            }
        }

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (!isScrolling) {
                    snapToNearest();
                }
            }, 300);
        });
    </script>

</body>
</html>
